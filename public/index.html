<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; padding: 16px;
    background: #f2f2f2; color: #1a1a1a;
    font-family: Arial, Helvetica, sans-serif;
    display: flex; justify-content: center; align-items: center;
  }
  .chat {
    width: 100%; max-width: 536px; height: min(750px, 100%);
    background: #fff; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 6px 24px rgba(0,0,0,.14);
  }
  .chat-head { background: #222; color: #fff; text-align: center; padding: 18px 16px 16px; }
  .chat-head h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .chat-head p { margin: 6px 0 0; font-size: 13px; color: #d6d6d6; }
  .messages {
    flex: 1; overflow-y: auto; padding: 22px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 70%; padding: 16px; border-radius: 14px;
    font-size: 16px; line-height: 1.6;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.bot { background: #e8e8e8; align-self: flex-start; }
  .msg.user { background: #222; color: #fff; align-self: flex-end; }
  .typing { display: inline-flex; gap: 4px; align-items: center; height: 1.6em; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: .35; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: 1; } }
  .composer { display: flex; gap: 12px; padding: 16px; border-top: 1px solid #e6e6e6; }
  .composer input {
    flex: 1; min-width: 0; padding: 13px 14px; font-size: 15px;
    border: 1px solid #d4d4d4; border-radius: 10px; outline: none;
  }
  .composer input:focus { border-color: #222; }
  .composer button {
    padding: 0 20px; border: 0; border-radius: 10px; cursor: pointer;
    background: #222; color: #fff; font-size: 15px;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div class="chat">
    <div class="chat-head">
      <h1>Chatbot AI</h1>
      <p>inclusionai/ling-3.0-flash:free</p>
    </div>

    <div class="messages" id="messages">
      <div class="msg bot">Halo! Ada yang bisa saya bantu?</div>
    </div>

    <div class="composer">
      <input id="input" type="text" placeholder="Ketik pesan..." autocomplete="off">
      <button id="send" type="button">Kirim</button>
    </div>
  </div>

<script>
const box = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

// Riwayat percakapan yang dikirim ke server (array messages)
const history = [];

function add(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  add(text, 'user');
  history.push({ role: 'user', content: text });
  input.value = '';
  sendBtn.disabled = true;

  const botEl = add('', 'bot');
  botEl.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  let reply = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(typeof err.error === 'string' ? err.error : 'Request gagal');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finished = false;

    while (!finished) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;

        const data = t.slice(5).trim();
        if (data === '[DONE]') { finished = true; break; }

        try {
          reply += JSON.parse(data);
          botEl.textContent = reply;
          box.scrollTop = box.scrollHeight;
        } catch (e) { /* abaikan potongan yang belum lengkap */ }
      }
    }

    if (!reply) throw new Error('Jawaban kosong');
    history.push({ role: 'assistant', content: reply });

  } catch (e) {
    console.error(e);
    botEl.textContent = 'Pesan gagal dikirim. Coba lagi.';
    history.pop(); // buang pesan user yang gagal supaya riwayat tetap rapi
  }

  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
